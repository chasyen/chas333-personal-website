name: Sync public HackMD posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Fetch public HackMD posts
        env:
          HACKMD_API_TOKEN: ${{ secrets.HACKMD_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HACKMD_API_TOKEN"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $HACKMD_API_TOKEN" \
            https://api.hackmd.io/v1/notes \
            | jq '[
                .[]
                | select(.readPermission == "guest" and (.publishLink != null and .publishLink != ""))
                | {
                    title,
                    createdAt,
                    lastChangedAt,
                    publishLink
                  }
              ]
              | sort_by(.lastChangedAt // .createdAt)
              | reverse
              | .[:12]' > hackmd-posts.json

      - name: Commit updated article list
        run: |
          if git diff --quiet -- hackmd-posts.json; then
            echo "No HackMD changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hackmd-posts.json
          git commit -m "chore: sync public HackMD posts"
          git push
